spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://mysql-reporte:3306/db_reporte}
    username: ${DB_USERNAME:dev}
    password: ${DB_PASSWORD:dev123}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.MySQLDialect
  flyway:
    enabled: false

app:
  pago:
    url: ${PAGO_URL:http://pago:8087}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://eurekaserver:8761/eureka/}

logging:
  level:
    root: WARN
    org.springframework.web: WARN
    com.marketplace.reporte: INFO