version: '3.8'

services:

  mysql:
    image: mysql:8.4
    container_name: reporte-mysql
    restart: always
    environment:
      MYSQL_DATABASE: db_reporte
      MYSQL_USER: ${DB_USERNAME:-dev}
      MYSQL_PASSWORD: ${DB_PASSWORD:-dev123}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root123}
    ports:
      - "3311:3306"
    networks:
      - reporte-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
      interval: 10s

  eurekaserver:
    build:
      context: ../eurekaserver
    image: eurekaserver:1.0
    container_name: reporte-eurekaserver
    ports:
      - "8761:8761"
    networks:
      - reporte-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8761"]
      timeout: 10s
      retries: 10
      interval: 15s
      start_period: 30s

  reporte:
    build:
      context: .
    image: reporte:1.0
    container_name: reporte-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_URL: jdbc:mysql://mysql:3306/db_reporte
      DB_USERNAME: ${DB_USERNAME:-dev}
      DB_PASSWORD: ${DB_PASSWORD:-dev123}
      EUREKA_URL: http://eurekaserver:8761/eureka/
      PAGO_URL: http://pago:8087
    depends_on:
      mysql:
        condition: service_healthy
      eurekaserver:
        condition: service_healthy
    ports:
      - "8090:8090"
    networks:
      - reporte-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8090/actuator/health"]
      timeout: 10s
      retries: 5
      interval: 10s

networks:
  reporte-network:
    driver: bridge
