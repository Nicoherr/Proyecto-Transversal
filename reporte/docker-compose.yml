version: '3.8'

services:

  mysql:
    image: mysql:8.4
    container_name: reporte-mysql
    restart: always
    environment:
      MYSQL_DATABASE: db_reporte
      MYSQL_USER: dev
      MYSQL_PASSWORD: dev123
      MYSQL_ROOT_PASSWORD: root123
    ports:
      - "3311:3306"
    networks:
      - reporte-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
      interval: 10s

  eurekaserver:
    build:
      context: ../eurekaserver
    image: eurekaserver:1.0
    container_name: reporte-eurekaserver
    ports:
      - "8761:8761"
    networks:
      - reporte-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
      timeout: 10s
      retries: 5
      interval: 10s

  reporte:
    build:
      context: .
    image: reporte:1.0
    container_name: reporte-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      mysql:
        condition: service_healthy
      eurekaserver:
        condition: service_healthy
    ports:
      - "8090:8090"
    networks:
      - reporte-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090/actuator/health"]
      timeout: 10s
      retries: 5
      interval: 10s

networks:
  reporte-network:
    driver: bridge