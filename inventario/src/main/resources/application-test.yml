spring:
  application:
    name: inventario
  datasource:
    url: jdbc:mysql://localhost:3306/marketplacee_inventario_test?createDatabaseIfNotExist=true
    username: root
    password: system
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
  flyway:
    enabled: false

server:
  port: 8082
  servlet:
    context-path: /api/v1/

logging:
  level:
    root: WARN
    com.marketplace.inventario: DEBUG
  file:
    name: app.log
    path: ./logs