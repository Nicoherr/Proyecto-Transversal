spring:
  application:
    name: inventario
  datasource:
    url: jdbc:mysql://mysql-inventario:3306/db_inventario?createDatabaseIfNotExist=true
    username: ${MYSQL_USER:dev}
    password: ${MYSQL_PASSWORD:dev123}
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.MySQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8082
  servlet:
    context-path: /api/v1/

eureka:
  client:
    service-url:
      defaultZone: http://eurekaserver:8761/eureka/
  instance:
    prefer-ip-address: true

