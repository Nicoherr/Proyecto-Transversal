spring:
  application:
    name: inventario
  datasource:
    url: jdbc:mysql://localhost:3306/marketplacee_inventario_prod?createDatabaseIfNotExist=true
    username: root
    password: system
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.MySQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8082
  servlet:
    context-path: /api/v1/

logging:
  level:
    root: ERROR
    com.marketplace.inventario: WARN
  file:
    name: app.log
    path: ./logs