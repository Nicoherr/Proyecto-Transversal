spring:
  application:
    name: producto
  datasource:
    url: jdbc:mysql://localhost:3306/db_productos_prod?createDatabaseIfNotExist=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    database-platform: org.hibernate.dialect.MySQLDialect
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8084

logging:
  level:
    root: ERROR
    com.marketplace.producto: WARN
  file:
    name: app.log
    path: ./logs