spring:
  application:
    name: producto
  datasource:
    url: jdbc:mysql://localhost:3306/db_productos_test?createDatabaseIfNotExist=true
    username: root
    password: system
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    database-platform: org.hibernate.dialect.MySQLDialect
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: false

server:
  port: 8084

logging:
  level:
    root: WARN
    com.marketplace.producto: DEBUG
  file:
    name: app.log
    path: ./logs