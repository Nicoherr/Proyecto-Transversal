spring:
  application:
    name: producto
  datasource:
    url: jdbc:mysql://mysql-producto:3306/db_producto?createDatabaseIfNotExist=true
    username: ${MYSQL_USER:dev}
    password: ${MYSQL_PASSWORD:dev123}
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    database-platform: org.hibernate.dialect.MySQLDialect
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8084

eureka:
  client:
    service-url:
      defaultZone: http://eurekaserver:8761/eureka/
  instance:
    prefer-ip-address: true

