spring:
  application:
    name: producto
  datasource:
    url: jdbc:mysql://localhost:3306/db_productos?createDatabaseIfNotExist=true
    username: root
    password:
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    database-platform: org.hibernate.dialect.MySQLDialect
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8084

logging:
  level:
    root: WARN
    org.springframework.web: DEBUG
    com.marketplace.producto: TRACE
  file:
    name: app.log
    path: ./logs

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /doc/swagger-ui.html