spring:
  application:
    name: gateway
  cloud:
    gateway:
      mvc:
        routes:
          - id: valoracion
            uri: http://localhost:8088
            predicates:
              - Path=/api/valoracion/**
            filters:
              - StripPrefix=1

          - id: notificacion
            uri: http://localhost:8089
            predicates:
              - Path=/api/notificaciones/**
            filters:
              - StripPrefix=1

          - id: pago
            uri: http://localhost:8087
            predicates:
              - Path=/api/pagos/**
            filters:
              - StripPrefix=1

          - id: pedido
            uri: http://localhost:8086
            predicates:
              - Path=/api/pedidos/**
            filters:
              - StripPrefix=1

          - id: reporte
            uri: http://localhost:8090
            predicates:
              - Path=/api/reportes/**
            filters:
              - StripPrefix=1

server:
  port: 8080

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/