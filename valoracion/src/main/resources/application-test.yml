spring:
  datasource:
    url: jdbc:h2:mem:db_valoracion_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

  flyway:
    enabled: false

  h2:
    console:
      enabled: true

app:
  jwt:
    secret: test-secret-key-test-secret-key-test-secret-key-123456
    expiration-ms: 86400000

logging:
  level:
    root: WARN
    org.springframework.web: DEBUG
    com.marketplace.valoracion: DEBUG