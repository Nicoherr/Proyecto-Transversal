server:
  port: 8088

spring:
  application:
    name: valoracion

  datasource:
    url: jdbc:mysql://127.0.0.1:3306/db_valoracion?createDatabaseIfNotExist=true
    username: root
    password: ~

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration