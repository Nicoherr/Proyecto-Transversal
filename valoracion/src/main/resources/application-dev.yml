spring:
  application:
    name: valoracion-service
  datasource:
    url: jdbc:mysql://localhost:3306/db_valoracion?createDatabaseIfNotExist=true
    username: root
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
  flyway:
    enabled: false
    locations: classpath:db/migration

server:
  port: 8088
  servlet:
    context-path: /api/v1/

logging:
  level:
    root: WARN
    org.springframework.web: DEBUG
    com.marketplace.valoracion: TRACE
  file:
    name: app.log
    path: ./logs

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /doc/swagger-ui.html

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true