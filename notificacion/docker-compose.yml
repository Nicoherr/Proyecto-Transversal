version: '3.8'

services:

  mysql:
    image: mysql:8.4
    container_name: notificacion-mysql
    restart: always
    environment:
      MYSQL_DATABASE: db_notificacion
      MYSQL_USER: ${DB_USERNAME:-dev}
      MYSQL_PASSWORD: ${DB_PASSWORD:-dev123}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root123}
    ports:
      - "3308:3306"
    networks:
      - notificacion-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
      interval: 10s

  eurekaserver:
    build:
      context: ../eurekaserver
    image: eurekaserver:1.0
    container_name: notificacion-eurekaserver
    ports:
      - "8761:8761"
    networks:
      - notificacion-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8761"]
      timeout: 10s
      retries: 10
      interval: 15s
      start_period: 30s

  notificacion:
    build:
      context: .
    image: notificacion:1.0
    container_name: notificacion-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_URL: jdbc:mysql://mysql:3306/db_notificacion
      DB_USERNAME: ${DB_USERNAME:-dev}
      DB_PASSWORD: ${DB_PASSWORD:-dev123}
      EUREKA_URL: http://eurekaserver:8761/eureka/
      PEDIDO_URL: http://pedido:8086
    depends_on:
      mysql:
        condition: service_healthy
      eurekaserver:
        condition: service_healthy
    ports:
      - "8089:8089"
    networks:
      - notificacion-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8089/actuator/health"]
      timeout: 10s
      retries: 5
      interval: 10s

networks:
  notificacion-network:
    driver: bridge