spring:
  datasource:
    url: jdbc:mysql://localhost:3306/db_notificacion?createDatabaseIfNotExist=true
    username: root
    password: admin2026
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  jwt:
    secret: dev-secret-key-dev-secret-key-dev-secret-key-123456
    expiration-ms: 86400000

logging:
  level:
    root: WARN
    org.springframework.web: DEBUG
    com.marketplace.notificacion: TRACE
  file:
    name: app.log
    path: ./logs