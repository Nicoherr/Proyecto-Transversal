spring:
  application:
    name: notificacion-service
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.MySQLDialect
  flyway:
    enabled: false

server:
  port: ${SERVER_PORT:8089}
  servlet:
    context-path: /api/v1

logging:
  level:
    root: ERROR
    org.springframework.web: WARN
    com.marketplace.notificacion: INFO

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

app:
  pedido:
    url: ${PEDIDO_URL:http://localhost:8086}