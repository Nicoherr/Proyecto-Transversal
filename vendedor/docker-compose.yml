version: '3.8'

services:

  mysql:
    image: mysql:8.4
    container_name: vendedor-mysql
    restart: always
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:dev_vendedor}
      MYSQL_USER: ${MYSQL_USER:dev}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:dev123}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:root123}
    ports:
      - "3311:3306"
    volumes:
      - ../docker/mysql/init:/docker-entrypoint-initdb.d
    networks:
      - vendedor-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
      interval: 10s

  eurekaserver:
    build:
      context: ../eurekaserver
    image: eurekaserver:1.0
    container_name: vendedor-eurekaserver
    ports:
      - "8761:8761"
    networks:
      - vendedor-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
      timeout: 10s
      retries: 5
      interval: 10s

  vendedor:
    build:
      context: .
    image: vendedor:1.0
    container_name: vendedor-service
    depends_on:
      mysql:
        condition: service_healthy
      eurekaserver:
        condition: service_healthy
    ports:
      - "8083:8083"
    networks:
      - vendedor-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/actuator/health"]
      timeout: 10s
      retries: 5
      interval: 10s

networks:
  vendedor-network:
    driver: bridge