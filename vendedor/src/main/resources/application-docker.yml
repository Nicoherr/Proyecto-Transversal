spring:
  application:
    name: vendedor
  datasource:
    url: jdbc:mysql://mysql-vendedor:3306/db_vendedor?createDatabaseIfNotExist=true
    username: ${MYSQL_USER:dev}
    password: ${MYSQL_PASSWORD:dev123}
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.MySQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8083

eureka:
  client:
    service-url:
      defaultZone: http://eurekaserver:8761/eureka/
  instance:
    prefer-ip-address: true

