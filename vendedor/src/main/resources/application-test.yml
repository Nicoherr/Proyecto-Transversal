spring:
  application:
    name: vendedor
  datasource:
    url: jdbc:mysql://localhost:3306/db_vendedores_test?createDatabaseIfNotExist=true
    username: root
    password: system
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
  flyway:
    enabled: false

server:
  port: 8083

logging:
  level:
    root: WARN
    com.marketplace.vendedor: DEBUG