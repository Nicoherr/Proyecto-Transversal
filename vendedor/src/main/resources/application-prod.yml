spring:
  application:
    name: vendedor
  datasource:
    url: jdbc:mysql://localhost:3306/db_vendedores_prod?createDatabaseIfNotExist=true
    username: root
    password: system
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.MySQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8083

logging:
  level:
    root: ERROR
    com.marketplace.vendedor: WARN
  file:
    name: app.log
    path: ./logs