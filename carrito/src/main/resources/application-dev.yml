spring:
  application:
    name: carrito
  datasource:
    url: jdbc:mysql://localhost:3306/marketplace-carrito?createDatabaseIfNotExist=true
    username: root
    password: system
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8081
  servlet:
    context-path: /api/v1/

logging:
  level:
    root: WARN
    org.springframework.web: DEBUG
    com.marketplace.carrito: TRACE
  file:
    name: app.log
    path: ./logs

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /doc/swagger-ui.html