spring:
  application:
    name: carrito
  datasource:
    url: jdbc:mysql://localhost:3306/marketplace-carrito-test?createDatabaseIfNotExist=true
    username: root
    password: system
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
  flyway:
    enabled: false

server:
  port: 8081
  servlet:
    context-path: /api/v1/

logging:
  level:
    root: WARN
    com.marketplace.carrito: DEBUG
  file:
    name: app.log
    path: ./logs