      timeout: 10s
      retries: 5
      interval: 10s

  vendedor:
    build:
      context: ./vendedor
    image: vendedor:1.0
    container_name: vendedor
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      mysql-vendedor:
        condition: service_healthy
      eurekaserver:
        condition: service_healthy
    ports:
      - "8083:8083"
    networks:
      - marketplace-network
    healthcheck:
      test: [ "CMD", "wget", "-q", "--spider", "http://localhost:8083/actuator/health" ]
      timeout: 10s
      retries: 5
      interval: 10s

  # ===================================================================
  # API GATEWAY
  # ===================================================================

  gateway:
    build:
      context: ./gateway
    image: gateway:1.0
    container_name: gateway
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVICES_CARRITO_URL: http://carrito:8081
      SERVICES_INVENTARIO_URL: http://inventario:8082
      SERVICES_PRODUCTO_URL: http://producto:8084
      SERVICES_USUARIO_URL: http://usuario:8080
      SERVICES_VENDEDOR_URL: http://vendedor:8083
      SERVICES_VALORACION_URL: http://valoracion:8088
      SERVICES_NOTIFICACION_URL: http://notificacion:8089
      SERVICES_PAGO_URL: http://pago:8087
      SERVICES_PEDIDO_URL: http://pedido:8086
      SERVICES_REPORTE_URL: http://reporte:8090
    depends_on:
      carrito:
        condition: service_healthy
      inventario:
        condition: service_healthy
      producto:
        condition: service_healthy
      usuario:
        condition: service_healthy
      vendedor:
        condition: service_healthy
      valoracion:
        condition: service_healthy
      notificacion:
        condition: service_healthy
      pago:
        condition: service_healthy
      pedido:
        condition: service_healthy
      reporte:
        condition: service_healthy
      eurekaserver:
        condition: service_healthy
    ports:
      - "8080:8080"
    networks:
      - marketplace-network
    healthcheck:
      test: [ "CMD", "wget", "-q", "--spider", "http://localhost:8080/actuator/health" ]
      timeout: 10s
      retries: 5
      interval: 10s

networks:
  marketplace-network:
    driver: bridge