version: '3.8'

services:

  # ===================================================================
  # BASES DE DATOS - Una por cada microservicio
  # ===================================================================

  mysql-valoracion:
    image: mysql:8.4
    container_name: mysql-valoracion
    restart: always
    environment:
      MYSQL_DATABASE: db_valoracion
      MYSQL_USER: dev
      MYSQL_PASSWORD: dev123
      MYSQL_ROOT_PASSWORD: root123
    ports:
      - "3307:3306"
    networks:
      - marketplace-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
      interval: 10s

  mysql-notificacion:
    image: mysql:8.4
    container_name: mysql-notificacion
    restart: always
    environment:
      MYSQL_DATABASE: db_notificacion
      MYSQL_USER: dev
      MYSQL_PASSWORD: dev123
      MYSQL_ROOT_PASSWORD: root123
    ports:
      - "3308:3306"
    networks:
      - marketplace-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
      interval: 10s

  mysql-pago:
    image: mysql:8.4
    container_name: mysql-pago
    restart: always
    environment:
      MYSQL_DATABASE: db_pago
      MYSQL_USER: dev
      MYSQL_PASSWORD: dev123
      MYSQL_ROOT_PASSWORD: root123
    ports:
      - "3309:3306"
    networks:
      - marketplace-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
      interval: 10s

  mysql-pedido:
    image: mysql:8.4
    container_name: mysql-pedido
    restart: always
    environment:
      MYSQL_DATABASE: db_pedido
      MYSQL_USER: dev
      MYSQL_PASSWORD: dev123
      MYSQL_ROOT_PASSWORD: root123
    ports:
      - "3310:3306"
    networks:
      - marketplace-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
      interval: 10s

  mysql-reporte:
    image: mysql:8.4
    container_name: mysql-reporte
    restart: always
    environment:
      MYSQL_DATABASE: db_reporte
      MYSQL_USER: dev
      MYSQL_PASSWORD: dev123
      MYSQL_ROOT_PASSWORD: root123
    ports:
      - "3311:3306"
    networks:
      - marketplace-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
      interval: 10s
  mysql-carrito:
    image: mysql:8.4
    container_name: mysql-carrito
    restart: always
    environment:
       MYSQL_DATABASE: db_carrito
       MYSQL_USER: dev
       MYSQL_PASSWORD: dev123
       MYSQL_ROOT_PASSWORD: root123
    ports:
       - "3312:3306"
    networks:
      - marketplace-network
    healthcheck:
       test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
       timeout: 20s
       retries: 10
       interval: 10s

  mysql-inventario:
    image: mysql:8.4
    container_name: mysql-inventario
    restart: always
    environment:
      MYSQL_DATABASE: db_inventario
      MYSQL_USER: dev
      MYSQL_PASSWORD: dev123
      MYSQL_ROOT_PASSWORD: root123
    ports:
      - "3313:3306"
    networks:
      - marketplace-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
      interval: 10s

  mysql-producto:
    image: mysql:8.4
    container_name: mysql-producto
    restart: always
    environment:
      MYSQL_DATABASE: db_producto
      MYSQL_USER: dev
      MYSQL_PASSWORD: dev123
      MYSQL_ROOT_PASSWORD: root123
    ports:
      - "3314:3306"
    networks:
      - marketplace-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
      interval: 10s

  mysql-usuario:
    image: mysql:8.4
    container_name: mysql-usuario
    restart: always
    environment:
      MYSQL_DATABASE: db_usuario
      MYSQL_USER: dev
      MYSQL_PASSWORD: dev123
      MYSQL_ROOT_PASSWORD: root123
    ports:
      - "3315:3306"
    networks:
      - marketplace-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
      interval: 10s

  mysql-vendedor:
    image: mysql:8.4
    container_name: mysql-vendedor
    restart: always
    environment:
      MYSQL_DATABASE: db_vendedor
      MYSQL_USER: dev
      MYSQL_PASSWORD: dev123
      MYSQL_ROOT_PASSWORD: root123
    ports:
      - "3316:3306"
    networks:
      - marketplace-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
      interval: 10s
  # ===================================================================
  # EUREKA SERVER
  # ===================================================================

  eurekaserver:
    build:
      context: ./eurekaserver
    image: eurekaserver:1.0
    container_name: eurekaserver
    ports:
      - "8761:8761"
    networks:
      - marketplace-network
    healthcheck:
      test: [ "CMD", "wget", "-q", "--spider", "http://localhost:8761" ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  # ===================================================================
  # MICROSERVICIOS
  # ===================================================================

  valoracion:
    build:
      context: ./valoracion
    image: valoracion:1.0
    container_name: valoracion
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      mysql-valoracion:
        condition: service_healthy
      eurekaserver:
        condition: service_healthy
    ports:
      - "8088:8088"
    networks:
      - marketplace-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8088/actuator/health"]
      timeout: 10s
      retries: 5
      interval: 10s

  notificacion:
    build:
      context: ./notificacion
    image: notificacion:1.0
    container_name: notificacion
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      mysql-notificacion:
        condition: service_healthy
      eurekaserver:
        condition: service_healthy
    ports:
      - "8089:8089"
    networks:
      - marketplace-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8089/actuator/health"]
      timeout: 10s
      retries: 5
      interval: 10s

  pago:
    build:
      context: ./pago
    image: pago:1.0
    container_name: pago
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      mysql-pago:
        condition: service_healthy
      eurekaserver:
        condition: service_healthy
    ports:
      - "8087:8087"
    networks:
      - marketplace-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8087/actuator/health"]
      timeout: 10s
      retries: 5
      interval: 10s

  pedido:
    build:
      context: ./pedido
    image: pedido:1.0
    container_name: pedido
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      mysql-pedido:
        condition: service_healthy
      eurekaserver:
        condition: service_healthy
    ports:
      - "8086:8086"
    networks:
      - marketplace-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8086/actuator/health"]
      timeout: 10s
      retries: 5
      interval: 10s

  reporte:
    build:
      context: ./reporte
    image: reporte:1.0
    container_name: reporte
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      mysql-reporte:
        condition: service_healthy
      eurekaserver:
        condition: service_healthy
    ports:
      - "8090:8090"
    networks:
      - marketplace-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090/actuator/health"]
      timeout: 10s
      retries: 5
      interval: 10s
  carrito:
     build:
        context: ./carrito
     image: carrito:1.0
     container_name: carrito
     environment:
       SPRING_PROFILES_ACTIVE: docker
     depends_on:
       mysql-carrito:
         condition: service_healthy
       eurekaserver:
        condition: service_healthy
     ports:
     - "8081:8081"
     networks:
      - marketplace-network
     healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      timeout: 10s
      retries: 5
      interval: 10s

  inventario:
    build:
      context: ./inventario
    image: inventario:1.0
    container_name: inventario
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      mysql-inventario:
        condition: service_healthy
      eurekaserver:
        condition: service_healthy
    ports:
      - "8082:8082"
    networks:
      - marketplace-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/actuator/health"]
      timeout: 10s
      retries: 5
      interval: 10s

  producto:
    build:
      context: ./producto
    image: producto:1.0
    container_name: producto
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      mysql-producto:
        condition: service_healthy
      eurekaserver:
        condition: service_healthy
    ports:
      - "8084:8084"
    networks:
      - marketplace-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8084/actuator/health"]
      timeout: 10s
      retries: 5
      interval: 10s

  usuario:
    build:
      context: ./usuario
    image: usuario:1.0
    container_name: usuario
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      mysql-usuario:
        condition: service_healthy
      eurekaserver:
        condition: service_healthy
    ports:
      - "8080:8080"
    networks:
      - marketplace-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      timeout: 10s
      retries: 5
      interval: 10s

  vendedor:
    build:
      context: ./vendedor
    image: vendedor:1.0
    container_name: vendedor
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      mysql-vendedor:
        condition: service_healthy
      eurekaserver:
        condition: service_healthy
    ports:
      - "8083:8083"
    networks:
      - marketplace-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/actuator/health"]
      timeout: 10s
      retries: 5
      interval: 10s
  # ===================================================================
  # API GATEWAY
  # ===================================================================

  gateway:
    build:
      context: ./gateway
    image: gateway:1.0
    container_name: gateway
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      carrito:
        condition: service_healthy
      inventario:
          condition: service_healthy
      producto:
          condition: service_healthy
      usuario:
          condition: service_healthy
      vendedor:
          condition: service_healthy
      valoracion:
        condition: service_healthy
      notificacion:
        condition: service_healthy
      pago:
        condition: service_healthy
      pedido:
        condition: service_healthy
      reporte:
        condition: service_healthy
      eurekaserver:
        condition: service_healthy
    ports:
      - "8080:8080"
    networks:
      - marketplace-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      timeout: 10s
      retries: 5
      interval: 10s

networks:
  marketplace-network:
    driver: bridge
