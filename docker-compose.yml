version: '3.8'

services:

  # ===================================================================
  # BASES DE DATOS - Una por cada microservicio (Con Variables Dinámicas)
  # ===================================================================

  mysql-valoracion:
    image: mysql:8.4
    container_name: mysql-valoracion
    restart: always
    environment:
      MYSQL_DATABASE: ${MYSQL_VALORACION_DB:db_valoracion}
      MYSQL_USER: ${MYSQL_USER:dev}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:dev123}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:root123}
    ports:
      - "3307:3306"
    networks:
      - marketplace-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
      interval: 10s

  mysql-notificacion:
    image: mysql:8.4
    container_name: mysql-notificacion
    restart: always
    environment:
      MYSQL_DATABASE: ${MYSQL_NOTIFICACION_DB:db_notificacion}
      MYSQL_USER: ${MYSQL_USER:dev}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:dev123}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:root123}
    ports:
