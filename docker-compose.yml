      context: ./pedido
    image: pedido:1.0
    container_name: pedido
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      mysql-pedido:
        condition: service_healthy
      eurekaserver:
        condition: service_healthy
    ports:
      - "8086:8086"
    networks:
      - marketplace-network
    healthcheck:
      test: [ "CMD", "wget", "-q", "--spider", "http://localhost:8086/actuator/health" ]
