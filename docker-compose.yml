      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
      interval: 10s

  # ===================================================================
  # EUREKA SERVER
  # ===================================================================

  eurekaserver:
    build:
      context: ./eurekaserver
    image: eurekaserver:1.0
    container_name: eurekaserver
    ports:
      - "8761:8761"
    networks:
      - marketplace-network
    healthcheck:
      test: [ "CMD", "wget", "-q", "--spider", "http://localhost:8761" ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  # ===================================================================
  # MICROSERVICIOS
  # ===================================================================

  valoracion:
    build:
      context: ./valoracion
    image: valoracion:1.0
    container_name: valoracion
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      mysql-valoracion:
        condition: service_healthy
      eurekaserver:
        condition: service_healthy
    ports:
      - "8088:8088"
    networks:
      - marketplace-network
    healthcheck:
      test: [ "CMD", "wget", "-q", "--spider", "http://localhost:8088/actuator/health" ]
      timeout: 10s
      retries: 5
      interval: 10s

  notificacion:
    build:
      context: ./notificacion
    image: notificacion:1.0
    container_name: notificacion
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      mysql-notificacion:
        condition: service_healthy
      eurekaserver:
        condition: service_healthy
    ports:
      - "8089:8089"
    networks:
      - marketplace-network
    healthcheck:
      test: [ "CMD", "wget", "-q", "--spider", "http://localhost:8089/actuator/health" ]
