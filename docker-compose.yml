version: '3.8'

services:

  # ===================================================================
  # BASES DE DATOS - Una por cada microservicio
  # ===================================================================

  mysql-valoracion:
    image: mysql:8.4
    container_name: mysql-valoracion
    restart: always
    environment:
      MYSQL_DATABASE: db_valoracion
      MYSQL_USER: dev
      MYSQL_PASSWORD: dev123
      MYSQL_ROOT_PASSWORD: root123
    ports:
      - "3307:3306"
    networks:
      - marketplace-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
      interval: 10s

  mysql-notificacion:
    image: mysql:8.4
    container_name: mysql-notificacion
    restart: always
    environment:
      MYSQL_DATABASE: db_notificacion
      MYSQL_USER: dev
      MYSQL_PASSWORD: dev123
      MYSQL_ROOT_PASSWORD: root123
    ports:
      - "3308:3306"
    networks:
      - marketplace-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
      interval: 10s

  mysql-pago:
    image: mysql:8.4
    container_name: mysql-pago
    restart: always
    environment:
      MYSQL_DATABASE: db_pago
      MYSQL_USER: dev
      MYSQL_PASSWORD: dev123
      MYSQL_ROOT_PASSWORD: root123
    ports:
      - "3309:3306"
    networks:
      - marketplace-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
      interval: 10s

  mysql-pedido:
    image: mysql:8.4
    container_name: mysql-pedido
    restart: always
    environment:
      MYSQL_DATABASE: db_pedido
      MYSQL_USER: dev
      MYSQL_PASSWORD: dev123
      MYSQL_ROOT_PASSWORD: root123
    ports:
      - "3310:3306"
    networks:
      - marketplace-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
      interval: 10s

  mysql-reporte:
    image: mysql:8.4
    container_name: mysql-reporte
    restart: always
    environment:
      MYSQL_DATABASE: db_reporte
      MYSQL_USER: dev
      MYSQL_PASSWORD: dev123
      MYSQL_ROOT_PASSWORD: root123
    ports:
      - "3311:3306"
    networks:
      - marketplace-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
      interval: 10s

  # ===================================================================
  # EUREKA SERVER
  # ===================================================================

  eurekaserver:
    build:
      context: ./eurekaserver
    image: eurekaserver:1.0
    container_name: eurekaserver
    ports:
      - "8761:8761"
    networks:
      - marketplace-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
      timeout: 10s
      retries: 5
      interval: 10s

  # ===================================================================
  # MICROSERVICIOS
  # ===================================================================

  valoracion:
    build:
      context: ./valoracion
    image: valoracion:1.0
    container_name: valoracion
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      mysql-valoracion:
        condition: service_healthy
      eurekaserver:
        condition: service_healthy
    ports:
      - "8088:8088"
    networks:
      - marketplace-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8088/actuator/health"]
      timeout: 10s
      retries: 5
      interval: 10s

  notificacion:
    build:
      context: ./notificacion
    image: notificacion:1.0
    container_name: notificacion
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      mysql-notificacion:
        condition: service_healthy
      eurekaserver:
        condition: service_healthy
    ports:
      - "8089:8089"
    networks:
      - marketplace-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8089/actuator/health"]
      timeout: 10s
      retries: 5
      interval: 10s

  pago:
    build:
      context: ./pago
    image: pago:1.0
    container_name: pago
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      mysql-pago:
        condition: service_healthy
      eurekaserver:
        condition: service_healthy
    ports:
      - "8087:8087"
    networks:
      - marketplace-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8087/actuator/health"]
      timeout: 10s
      retries: 5
      interval: 10s

  pedido:
    build:
      context: ./pedido
    image: pedido:1.0
    container_name: pedido
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      mysql-pedido:
        condition: service_healthy
      eurekaserver:
        condition: service_healthy
    ports:
      - "8086:8086"
    networks:
      - marketplace-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8086/actuator/health"]
      timeout: 10s
      retries: 5
      interval: 10s

  reporte:
    build:
      context: ./reporte
    image: reporte:1.0
    container_name: reporte
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      mysql-reporte:
        condition: service_healthy
      eurekaserver:
        condition: service_healthy
    ports:
      - "8090:8090"
    networks:
      - marketplace-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090/actuator/health"]
      timeout: 10s
      retries: 5
      interval: 10s

  # ===================================================================
  # API GATEWAY
  # ===================================================================

  gateway:
    build:
      context: ./gateway
    image: gateway:1.0
    container_name: gateway
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      valoracion:
        condition: service_healthy
      notificacion:
        condition: service_healthy
      pago:
        condition: service_healthy
      pedido:
        condition: service_healthy
      reporte:
        condition: service_healthy
      eurekaserver:
        condition: service_healthy
    ports:
      - "8080:8080"
    networks:
      - marketplace-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      timeout: 10s
      retries: 5
      interval: 10s

networks:
  marketplace-network:
    driver: bridge
