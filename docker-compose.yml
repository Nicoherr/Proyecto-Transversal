      - "8090:8090"
    networks:
      - marketplace-network
    healthcheck:
      test: [ "CMD", "wget", "-q", "--spider", "http://localhost:8090/actuator/health" ]
      timeout: 10s
      retries: 5
      interval: 10s

  carrito:
    build:
      context: ./carrito
    image: carrito:1.0
    container_name: carrito
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      mysql-carrito:
        condition: service_healthy
      eurekaserver:
        condition: service_healthy
    ports:
      - "8081:8081"
    networks:
      - marketplace-network
