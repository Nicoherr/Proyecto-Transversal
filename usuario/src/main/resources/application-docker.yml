spring:
  application:
    name: usuario-service
  datasource:
    url: jdbc:mysql://mysql-usuario:3306/db_usuario?createDatabaseIfNotExist=true
    username: ${MYSQL_USER:dev}
    password: ${MYSQL_PASSWORD:dev123}
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.MySQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080
  servlet:
    context-path: /api/v1/

eureka:
  client:
    service-url:
      defaultZone: http://eurekaserver:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

