spring:
  application:
    name: usuario
  datasource:
    url: jdbc:mysql://localhost:3306/marketplace_usuarios?createDatabaseIfNotExist=true
    username: root
    password: system
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080
  servlet:
    context-path: /api/v1/

logging:
  level:
    root: WARN
    org.springframework.web: DEBUG
    com.marketplace.usuario: TRACE
  file:
    name: app.log
    path: ./logs

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /doc/swagger-ui.html
    eureka:
      client:
        service-url:
          defaultZone: http://localhost:8761/eureka/
      instance:
        prefer-ip-address: true

