spring:
  application:
    name: usuario
  datasource:
    url: jdbc:mysql://localhost:3306/marketplace_usuarios_prod?createDatabaseIfNotExist=true
    username: root
    password: system
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.MySQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
server:
  port: 8080
  servlet:
    context-path: /api/v1/
logging:
  level:
    root: ERROR
    com.marketplace.usuario: WARN
  file:
    name: app.log
    path: ./logs