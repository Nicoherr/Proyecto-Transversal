spring.application.name=usuario
server.port=8080
server.servlet.context-path=/api/v1/

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.datasource.url=jdbc:mysql://localhost:3306/marketplace_usuarios?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=system

#CAMBIE HIBERNATE DE VALIDATE A UPDATE SOLO PARA TESTEAR
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

#app.jwt.secret=dev-secret-key-dev-secret-key-dev-secret-key-123456
#app.jwt.expiration-ms=86400000

logging.level.root=WARN
logging.level.org.springframework.web=DEBUG
logging.level.com.marketplace.usuario=TRACE
logging.file.name=app.log
logging.file.path=./logs