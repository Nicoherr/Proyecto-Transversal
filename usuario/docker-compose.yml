version: '3.8'

services:

  mysql:
    image: mysql:8.4
    container_name: usuario-mysql
    restart: always
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:dev_usuario}
      MYSQL_USER: ${MYSQL_USER:dev}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:dev123}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:root123}
    ports:
      - "3310:3306"
    volumes:
      - ../docker/mysql/init:/docker-entrypoint-initdb.d
    networks:
      - usuario-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
      interval: 10s

  eurekaserver:
    build:
      context: ../eurekaserver
    image: eurekaserver:1.0
    container_name: usuario-eurekaserver
    ports:
      - "8761:8761"
    networks:
      - usuario-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
      timeout: 10s
      retries: 5
      interval: 10s

  usuario:
    build:
      context: .
    image: usuario:1.0
    container_name: usuario-service
    depends_on:
      mysql:
        condition: service_healthy
      eurekaserver:
        condition: service_healthy
    ports:
      - "8080:8080"
    networks:
      - usuario-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      timeout: 10s
      retries: 5
      interval: 10s

networks:
  usuario-network:
    driver: bridge